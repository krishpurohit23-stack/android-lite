name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare sources (unzip AndroidLite.zip if it is newer)
        run: |
          set -e
          if [ -f AndroidLite.zip ]; then
            rm -rf _unz && mkdir _unz && unzip -q AndroidLite.zip -d _unz
            ZB=$(grep -rho "ANDROID_LITE_BUILD=[0-9]*" _unz/Sources 2>/dev/null | head -1 | cut -d= -f2)
            RB=$(grep -rho "ANDROID_LITE_BUILD=[0-9]*" Sources 2>/dev/null | head -1 | cut -d= -f2)
            ZB=${ZB:-0}
            RB=${RB:-0}
            echo "zip build=$ZB, repo Sources build=$RB"
            if [ "$ZB" -ge "$RB" ]; then
              rm -rf Sources scripts
              cp -R _unz/Sources Sources
              if [ -d _unz/scripts ]; then cp -R _unz/scripts scripts; fi
              if [ -f _unz/CLAUDE.md ]; then cp _unz/CLAUDE.md CLAUDE.md; fi
            fi
          fi
          if [ ! -d Sources ]; then
            echo "ERROR: no Sources folder and no AndroidLite.zip in the repo root"
            ls
            exit 1
          fi
          ls Sources

      - name: Static check
        run: python3 scripts/check.py Sources

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Real-ESRGAN Core ML model
        id: modelcache
        uses: actions/cache@v4
        with:
          path: model_out
          key: esrgan-coreml-v1-${{ hashFiles('scripts/make_model.py') }}

      - name: Build Real-ESRGAN Core ML model (optional, about 5 min the first time only)
        if: steps.modelcache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          set -e
          python -m pip install --quiet "numpy<2" "torch==2.3.1" "coremltools==8.0"
          curl -L --fail -o RealESRGAN_x4plus.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth
          python scripts/make_model.py RealESRGAN_x4plus.pth RealESRGAN.mlpackage
          mkdir -p model_out
          xcrun coremlcompiler compile RealESRGAN.mlpackage model_out
          ls model_out

      - name: Generate Xcode project
        run: |
          cat > project.yml << 'EOF'
          name: AndroidLite
          options:
            bundleIdPrefix: com.androidlite
          targets:
            AndroidLite:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - Sources
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.androidlite.app
                  PRODUCT_NAME: AndroidLite
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_CFBundleDisplayName: Android Lite
                  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_UIStatusBarHidden: YES
                  INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
                  INFOPLIST_KEY_NSCameraUsageDescription: Android Lite camera app needs the camera to take photos and videos.
                  INFOPLIST_KEY_NSMicrophoneUsageDescription: Android Lite records sound when you record a video.
                  INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Android Lite saves your photos and videos to your Photos library.
                  MARKETING_VERSION: "1.0"
                  CURRENT_PROJECT_VERSION: "1"
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1"
          EOF
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project AndroidLite.xcodeproj \
            -scheme AndroidLite \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || {
              echo "=== COMPILER ERRORS ==="
              grep -E "error:" build.log | sort -u | head -40
              echo "=== LAST LINES ==="
              tail -30 build.log
              exit 1
            }
          echo "Build succeeded"

      - name: Package IPA (adds background audio mode for PiP / background play)
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/AndroidLite.app Payload/
          PLIST="Payload/AndroidLite.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" -c "Add :UIBackgroundModes:0 string audio" "$PLIST"
          if [ -d model_out/RealESRGAN.mlmodelc ]; then
            cp -R model_out/RealESRGAN.mlmodelc Payload/AndroidLite.app/
            echo "Real-ESRGAN model added to the app"
          else
            echo "Real-ESRGAN model NOT added - the camera will use the basic enhancer"
          fi
          zip -qr AndroidLite.ipa Payload

      - name: Publish IPA to Releases (direct .ipa download, no zip)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" AndroidLite.ipa \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Android Lite build ${{ github.run_number }}" \
            --notes "Download AndroidLite.ipa below and install it with SideStore." \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: AndroidLite-ipa
          path: AndroidLite.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
